# Sobe o sistema completo: banco, API e front-end.
# As senhas vêm do arquivo .env (copie o .env.exemplo).
services:
  banco:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${SENHA_ROOT_MYSQL:?preencha o arquivo .env}
      MYSQL_DATABASE: gestao_logistica_api
      MYSQL_USER: logistica
      MYSQL_PASSWORD: ${SENHA_BANCO:?preencha o arquivo .env}
    volumes:
      - dados_mysql:/var/lib/mysql
    # Verifica se o MySQL já aceita conexões
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: ./api
    ports:
      - "5080:8080"
    environment:
      ConnectionStrings__BancoGestaoLogistica: "Server=banco;Port=3306;Database=gestao_logistica_api;User=logistica;Password=${SENHA_BANCO};"
      Jwt__Chave: ${CHAVE_JWT:?preencha o arquivo .env}
      AdministradorInicial__Senha: ${SENHA_ADMIN:?preencha o arquivo .env}
      TZ: America/Sao_Paulo
    # A API só inicia depois que o banco estiver pronto
    depends_on:
      banco:
        condition: service_healthy

  front:
    build: ./front
    ports:
      - "5173:80"
    depends_on:
      - api

# Guarda os dados do banco mesmo se o container for removido
volumes:
  dados_mysql:
